name: nexo-social
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexo}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["nexo_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexo}
      API_PORT: 4100
    ports: ["4100:4100"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4100
    environment:
      API_INTERNAL_URL: http://api:4100
    ports: ["3100:3100"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  nexo_data:
